<style>
    :root{
        --primary-color: #02BD52;
        --forhighlight: #1BF640;
        --fortext: #FCFCFC;
        --second-color: #161618;
    }
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
    }
    
    .panel-body {
        border: none;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        background-color: #232323;
    }
    
    .card-body {
        padding: 15px;
    }
    
    .panel-primarys .panel-heading {
        color: #70ee9c;
        font-size: 18px;
        font-weight: bold;
        text-align: center;
        border-radius: 4px;
    }
    
    .info {
        font-size: 16px;
        color: #555;
        font-weight: bold;
        margin-bottom: 10px;
    }
    
    hr {
        border: 1px solid #ddd;
        margin: 15px 0;
    }
    
    .form-control {
        height: 40px;
        border: 1px solid #ccc;
        border-radius: 4px;
        padding: 5px 10px;
        font-size: 14px;
        color: #555;
        margin-bottom: 10px;
    }
    
    .form-control:focus {
        outline: none;
        border-color: #5dc88a;
        box-shadow: 0 0 5px rgba(93, 200, 138, 0.5);
    }
    
    label {
        font-size: 14px;
        font-weight: bold;
        color: #555;
        display: block;
        margin-bottom: 5px;
    }
    
    select {
        appearance: none;
        background-color: #fff;
        border: 1px solid #ccc;
        border-radius: 4px;
        padding: 5px 10px;
        font-size: 14px;
        width: 100%;
        height: 40px;
    }

    .text-center {
        text-align: center;
    }

    .modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.5);
    justify-content: center;
    align-items: center;
}

.modal-content {
    background-color: #232323;
    padding: 30px;
    border-radius: 8px;
    width: 400px;
    text-align: center;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
}

.modal-content input {
    width: 100%;
    margin: 15px 0;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 15px;
}

.close-btn {
    background-color: var(--primary-color);
    color: #fff;
    border: none;
    padding: 8px 15px;
    cursor: pointer;
    font-size: 16px;
    border-radius: 4px;
    transition: background-color 0.3s;
}

.close-btn:hover {
    background-color: #02BD52;
}

.btns {
    background-color: var(--primary-color);
    color: #fff;
    border: none;
    border-radius: 4px;
    height: 45px;
    width: 100%;
    max-width: 350px;
    text-align: center;
    margin: 25px auto 0;
    cursor: pointer;
    transition: background-color 0.3s;
}

.btns:hover {
    background-color: #08b453;
}

     
     
    
    @media (max-width: 768px) {
        .form-control {
            font-size: 12px;
        }
    
        .btns {
            font-size: 12px;
        }
    }
</style>

<body>
    <div class="panel-body">
        <div class="row">
            <div class="col-md-12">
                <div class="panel-primarys" id="logins">
                    <div class="panel-heading mb-4" style="text-align:center">USER REGISTER INFORMATION</div>
                    <form id="frmLogins" method="POST">
                        <div class="p-4">
                            <div id="admin-msgs"></div>
                            <p class="info" style="color: gray;">PERSONAL INFORMATION</p>
                            <hr>
        
                            <div class="row">
                                <div class="col-md-4">
                                    <label for="">Student Lastname</label>
                                    <p id="lname"></p>
                                </div>

                                <div class="col-md-4">
                                    <label for="">Student Middlename</label>
                                    <p id="mname"></p>
                                </div>

                                <div class="col-md-4">
                                    <label for="">Student Firstname</label>
                                    <p id="fname"></p>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-4">
                                    <label for="">Birthdate</label>
                                    <p id="bday"></p>
                                </div>

                                <div class="col-md-4">
                                    <label for="">Age</label>
                                    <p id="age"></p>
                                </div>

                                <div class="col-md-4">
                                    <label for="">Gender</label> 
                                    <p id="gender"></p>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-4">
                                    <label for="">ContactNumber</label>
                                    <p id="connum"></p>
                                </div>

                                <div class="col-md-4">
                                    <label for="">Email</label>
                                    <p id="email"></p>
                                </div>

                                <div class="col-md-4">
                                    <label for="">Institution</label>
                                    <p id="insti"></p>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <label for="">Student ID</label>
                                    <p id="student"></p>
                                </div>
                            </div>
                            <br>
                            
                            <p class="info" style="color: gray;">ADDRESS</p>
                            <hr>
        
                            <div class="row">
                                <div class="col-md-3">
                                    <label for="">Province</label>
                                    <p id="province"></p>
                                </div>
                                <div class="col-md-3">
                                    <label for="">City</label>
                                    <p id="city"></p>
                                </div>
                                <div class="col-md-3">
                                    <label for="">Barangay/Street</label>
                                    <p id="barangay"></p>
                                </div>
                                <div class="col-md-3">
                                    <label for="">Block & Lot</label>
                                    <p id="blk"></p>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-12" style="text-align: center;" >
                                 <p>Do you to change your account password?
                                     <button class="btns"  id="openModalBtn">Change Password </button>
                                 </p>
                                </div>
                        </div>
                    
                    </form>
                </div>
            </div>

                
             </div>
        </div>
        <div class="modal" id="passwordModal">
            <div class="modal-content">
                <h3>Change Password</h3>
                <form id="changePasswordForm">
                    <input class="form-control" type="password" id="currentPassword" placeholder="Current Password" required>
                    <input class="form-control" type="password" id="newPassword" placeholder="New Password" required>
                    <input class="form-control" type="password" id="confirmPassword" placeholder="Confirm Password" required>
                    <button type="submit" class="btns">Submit</button>
                </form>
                <button class="close-btn mt-2" id="closeModalBtn">Close</button>
            </div>
        </div>
    </div>
    
    <script src="scripts/info.js"></script>
    <script src="scripts/changepass.js"></script>

    
    
</body>
