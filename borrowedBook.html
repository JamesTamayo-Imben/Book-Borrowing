<section class="record-page record-page--borrowed" data-record-view="borrowed">
    <header class="record-page-header">
        <p class="record-page-eyebrow">Circulation</p>
        <h1>Borrowed books</h1>
        <p>Review active loans, find a record, or process a returned book.</p>
    </header>

    <section class="record-panel" aria-labelledby="borrowed-return-heading">
        <div class="record-panel-heading">
            <h2 id="borrowed-return-heading">Record a return</h2>
            <p>Enter the student and book IDs to close an active loan.</p>
        </div>
        <form id="frmLogins" class="record-return-form">
            <div class="record-field">
                <label for="sid">Student ID</label>
                <input type="text" name="sid" id="sid" placeholder="000-0000-0000" required class="form-control">
            </div>
            <div class="record-field">
                <label for="bid">Book ID</label>
                <input type="text" name="bid" id="bid" placeholder="KLDBK000" required class="form-control">
            </div>
            <button class="btn record-submit" type="submit" id="return">Record return</button>
        </form>
        <div id="admin-msgs" class="record-message" aria-live="polite"></div>
    </section>

    <section class="record-panel" aria-labelledby="borrowed-list-heading">
        <div class="record-panel-heading">
            <h2 id="borrowed-list-heading">Current loans</h2>
            <p>Filter by book, student, or either loan date.</p>
        </div>
        <div class="record-filter-bar" aria-label="Filter borrowed books">
            <div class="record-filter">
                <label for="borrowed-filter-book">Book ID</label>
                <input class="form-control" id="borrowed-filter-book" type="search" data-record-filter="0" placeholder="Find a book">
            </div>
            <div class="record-filter">
                <label for="borrowed-filter-student">Student ID</label>
                <input class="form-control" id="borrowed-filter-student" type="search" data-record-filter="3" placeholder="Find a student">
            </div>
            <div class="record-filter">
                <label for="borrowed-filter-date">Borrowed date</label>
                <input class="form-control" id="borrowed-filter-date" type="date" data-record-filter="1">
            </div>
            <div class="record-filter">
                <label for="borrowed-filter-return">Return date</label>
                <input class="form-control" id="borrowed-filter-return" type="date" data-record-filter="2">
            </div>
            <button class="record-filter-clear" type="button" data-clear-record-filters>Clear filters</button>
        </div>
        <div class="record-table-wrap">
            <table id="encounter" class="table">
                <thead>
                    <tr>
                        <th>Book ID</th>
                        <th>Borrowed date</th>
                        <th>Return date</th>
                        <th>Student ID</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </section>
</section>

<script src="scripts/return.js"></script>
<script src="scripts/borrowedBook.js"></script>
<script src="scripts/record-filters.js"></script>
