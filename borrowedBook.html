    /* Table Styles */
    .table {
        width: 100%;
        border-collapse: collapse;
        font-family: Arial, sans-serif;
        font-size: 14px;
        color: #ffffff;
        background-color: #000000;
    }
    
    /* Header Row 70ee9c 5dc88a 4bb77e*/
    .table thead th {
        background-color: #70ee9c;
        color: #ffffff;
        font-weight: bold;
        text-align: left;
        padding: 10px;
        border: 1px solid #70ee9c;
    }
    
    /* Data Rows */
    .table tbody td {
        padding: 8px;
        border: 1px solid #70ee9c; /* Darker Green Border */
    }
    
    /* Alternating Row Colors */
    .table tbody tr:nth-child(even) {
        background-color: #70ee9c; /* Slightly lighter green for contrast */
    }
    
    .table tbody tr:nth-child(odd) {
        background-color: #000000; /* Black */
    }
    
    /* Hover Effect */
    .table tbody tr:hover {
        background-color: #70ee9c; /* Brighter Green on Hover */
        color: #ffffff;
    }

    .form-control {
