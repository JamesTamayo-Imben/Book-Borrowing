<section class="registration-page" aria-labelledby="registration-title">
    <header class="account-page-heading">
        <div>
            <p class="account-eyebrow">Student accounts</p>
            <h1 id="registration-title">Register a student</h1>
            <p>Add student details to create a library account.</p>
        </div>
    </header>

    <section class="account-panel registration-panel" id="registration-panel">
        <form id="frmLogins" method="POST">
            <div id="admin-msgs" class="account-message" role="status" aria-live="polite" tabindex="-1"></div>

            <fieldset class="registration-section">
                <legend>Account and personal details</legend>
                <div class="registration-grid">
                    <div class="account-field">
                        <label for="username">Username</label>
                        <input type="text" name="username" id="username" class="form-control" autocomplete="username" required>
                    </div>
                    <div class="account-field">
                        <label for="student">Student ID</label>
                        <input type="text" name="student" id="student" class="form-control" placeholder="Enter student ID" required>
                    </div>
                    <div class="account-field">
                        <label for="lname">Last name</label>
                        <input type="text" name="lname" id="lname" class="form-control" autocomplete="family-name" required>
                    </div>
                    <div class="account-field">
                        <label for="fname">First name</label>
                        <input type="text" name="fname" id="fname" class="form-control" autocomplete="given-name" required>
                    </div>
                    <div class="account-field">
                        <label for="mname">Middle name</label>
                        <input type="text" name="mname" id="mname" class="form-control" autocomplete="additional-name" required>
                    </div>
                    <div class="account-field">
                        <label for="bday">Date of birth</label>
                        <input type="date" name="bday" id="bday" class="form-control" autocomplete="bday" required>
                    </div>
                    <div class="account-field">
                        <label for="age">Age</label>
                        <input type="number" name="age" id="age" class="form-control" readonly required aria-describedby="age-hint">
                        <small id="age-hint">Calculated from date of birth</small>
                    </div>
                    <div class="account-field">
                        <label for="gender">Gender</label>
                        <select name="gender" id="gender" class="form-control" required>
                            <option value="" disabled selected>Select gender</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class="account-field">
                        <label for="insti">Institution</label>
                        <select name="insti" id="insti" class="form-control" required>
                            <option value="" disabled selected>Select institution</option>
                            <option value="IMACS">IMACS</option>
                            <option value="ILA">ILA</option>
                            <option value="IOE">IOE</option>
                            <option value="ION">ION</option>
                            <option value="IOM">IOM</option>
                        </select>
                    </div>
                    <div class="account-field">
                        <label for="connum">Contact number</label>
                        <input type="tel" name="connum" id="connum" class="form-control" placeholder="09XXXXXXXXX" inputmode="numeric" pattern="[0-9]{11}" maxlength="11" autocomplete="tel" required aria-describedby="contact-hint">
                        <small id="contact-hint">Enter 11 digits</small>
                    </div>
                    <div class="account-field account-field-wide">
                        <label for="email">Email</label>
                        <input type="email" name="email" id="email" class="form-control" autocomplete="email" required>
                    </div>
                </div>
            </fieldset>

            <fieldset class="registration-section">
                <legend>Address</legend>
                <div class="registration-grid">
                    <div class="account-field">
                        <label for="province">Province</label>
                        <input type="text" name="province" id="province" class="form-control" autocomplete="address-level1" required>
                    </div>
                    <div class="account-field">
                        <label for="city">City</label>
                        <input type="text" name="city" id="city" class="form-control" autocomplete="address-level2" required>
                    </div>
                    <div class="account-field">
                        <label for="brgy">Barangay or street</label>
                        <input type="text" name="brgy" id="brgy" class="form-control" autocomplete="address-line1" required>
                    </div>
                    <div class="account-field">
                        <label for="blk">Block and lot</label>
                        <input type="text" name="blk" id="blk" class="form-control" autocomplete="address-line2" required>
                    </div>
                </div>
            </fieldset>

            <input type="hidden" name="action" value="isLogins">
            <div class="registration-actions">
                <p>All fields are required. The initial password is the student ID.</p>
                <button type="submit" class="account-primary-button" id="btnRegister">Create student account</button>
            </div>
        </form>
    </section>
</section>

<script src="scripts/register.js"></script>
<script>
    $(function () {
        register.init();
    });
</script>
