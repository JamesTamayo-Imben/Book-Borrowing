<style>
  body {
      /* color: #232323; */
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
  }
  
  .card {
      border: none;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      background-color: #232323;
  }
  
  .card-body {
      padding: 15px;
  }
  
  .panel-primarys .panel-heading {
      /* background-color: #5dc88a; */
      color: #70ee9c;
      font-size: 18px;
      font-weight: bold;
      text-align: center;
      /* padding: 10px; */
      border-radius: 4px;
  }
  
  .info {
      font-size: 16px;
      color: #555;
      font-weight: bold;
      margin-bottom: 10px;
  }
  
  hr {
      border: 1px solid #ddd;
      margin: 15px 0;
  }
  
  .form-control {
      height: 40px;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 5px 10px;
      font-size: 14px;
      color: #555;
      margin-bottom: 10px;
  }
  
  .form-control:focus {
      outline: none;
      border-color: #5dc88a;
      box-shadow: 0 0 5px rgba(93, 200, 138, 0.5);
  }
  
  label {
      font-size: 14px;
      font-weight: bold;
      color: #fff;
      display: block;
      margin-bottom: 5px;
  }
  
  select {
      appearance: none;
      background-color: #fff;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 5px 10px;
      font-size: 14px;
      width: 100%;
      height: 40px;
  }

  .text-center {
    text-align: center;
}
  
  .btns {
      background-color: #5dc88a;
      color: #fff;
      border: none;
      border-radius: 4px;
      height: 40px;
      width: 100%;
      max-width: 300px;
      font-size: 14px;
      text-align: center;
      margin: 20px auto 0;
      cursor: pointer;
      transition: background-color 0.3s;
  }
  
  .btns:hover {
      background-color: #4bb77e;
  }
  
  @media (max-width: 768px) {
      .form-control {
          font-size: 12px;
      }
  
      .btns {
          font-size: 12px;
      }
  }
  </style>
  

<body>

  <div class="card r-5">
    <div class="card-body">
