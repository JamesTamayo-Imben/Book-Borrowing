<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Book borrowing system sign in panel">
    <meta name="author" content="Calibuso, Dela Cruz, Quintos, Tamayo, Sumulong">
    <title>Sign In | Book Borrowing</title>
    <link rel="icon" type="image/png" href="images/logo.png">
    <link href="publics/plugins/bootstrap/css/bootstrap.min.css" rel="stylesheet" />
    <link href="publics/plugins/font-awesome/css/font-awesome.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
    <link href="publics/systemCss/login.css" rel="stylesheet">
</head>
<body>
  <div class="backgroundImage" aria-hidden="true"></div>
  <div class="container-fluid logInPanel">
    <div class="row">
      <div class="col-md-6 leftSide">
        <div class="login-intro">
          <img src="images/logo.png" class="login-brand" alt="KLD Keep Learning and Discovering">
          <p class="login-kicker">Library services</p>
          <h1>Books for your next chapter</h1>
          <p>Sign in to browse the collection and manage your borrowing account.</p>
        </div>
      </div>

      <div class="col-md-6 rightSide">
        <section class="login-card" id="login" aria-labelledby="login-title">
          <p class="login-kicker">Book Borrowing System</p>
          <h2 id="login-title">Sign in</h2>
          <p class="login-card-intro">Use your username and password to continue.</p>
          <form id="frmLogin" method="POST" action="dashboard.html">
            <div id="admin-msg" class="login-message" role="alert" aria-live="assertive" tabindex="-1"></div>
            <input type="hidden" name="action" value="isLogin">
            <div class="login-field">
              <label for="username">Username</label>
              <input type="text" name="username" id="username" class="form-control" autocomplete="username" required>
            </div>
            <div class="login-field">
              <label for="password">Password</label>
              <input type="password" name="password" id="password" class="form-control" autocomplete="current-password" required>
            </div>
            <button type="submit" class="login-submit" id="btnLogin">Sign in</button>
          </form>
        </section>
      </div>
    </div>
  </div>

  <script src="publics/plugins/jquery/jquery-1.9.1.min.js"></script>
  <script src="publics/plugins/bootstrap/js/bootstrap.min.js"></script>
  <script src="publics/plugins/jquery-blockui/js/jquery.blockUI.js"></script>
  <script src="scripts/login.js"></script>


  <script>
    $(document).ready(function(){
      Login.init();
    });
  </script>

</body>
</html>
