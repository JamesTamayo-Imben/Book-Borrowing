<section class="notifications-page" aria-labelledby="notifications-title">
    <header class="library-page-heading">
        <div>
            <p class="library-eyebrow">Your library</p>
            <h1 id="notifications-title">Notifications</h1>
            <p>Stay informed about your borrowing activity and library updates.</p>
        </div>
    </header>

    <section class="notifications-panel library-panel" aria-label="Your notifications">
        <ul class="nav nav-tabs notification-tabs" role="group" aria-label="Filter notifications">
            <li class="nav-item">
                <button class="nav-link active" type="button" aria-pressed="true" id="notif-all">All</button>
            </li>
            <li class="nav-item">
                <button class="nav-link" type="button" aria-pressed="false" id="notif-warning">Warnings</button>
            </li>
            <li class="nav-item">
                <button class="nav-link" type="button" aria-pressed="false" id="notif-return">Returns</button>
            </li>
            <li class="nav-item">
                <button class="nav-link" type="button" aria-pressed="false" id="notif-borrow">Borrows</button>
            </li>
        </ul>

        <div class="notif-types" id="notif-types" role="region" aria-label="Notification records" aria-live="polite" tabindex="0">
            <div id="notif-box-all" class="notification-list" aria-live="polite" aria-busy="true">
                <p class="notification-results-state">Loading notifications...</p>
            </div>
        </div>
    </section>
</section>

<script>
    document.querySelectorAll('.notifications-page .nav-link').forEach(function (tab) {
        tab.addEventListener('click', function () {
            document.querySelectorAll('.notifications-page .nav-link').forEach(function (item) {
                item.classList.remove('active');
                item.setAttribute('aria-pressed', 'false');
            });
            this.classList.add('active');
            this.setAttribute('aria-pressed', 'true');
        });
    });
</script>
<script src="scripts/notifBoxAll.js"></script>
<script src="scripts/notifNavs.js"></script>
