<script>
  $(document).ready(function() {
  // Get today's date and format it as YYYY-MM-DD
  const today = new Date();
  const year = today.getFullYear();
  const month = String(today.getMonth() + 1).padStart(2, '0');
  const day = String(today.getDate()).padStart(2, '0');
  const formattedDate = `${year}-${month}-${day}`;

  // Delegate the submit event to the dynamic form element
  $(document).on("submit", "form[id^='form-borrow-']", function(event) {
    event.preventDefault(); // Prevent the default form submission


    var formId = $(this).attr('id');
    // var counter = formId.split('-')[3]; // ID bookID
    var bookID = formId.split('-')[2];

    document.getElementById('borrowedDT-' + bookID).value = formattedDate;

    document.getElementById('returnDate-' + bookID).min = formattedDate;
    // Log to console for verification
    console.log(`Hidden input (borrowedDT-${bookID}) value set to: ${formattedDate}`);

    var bookIDD = $("#bookIDD-" + bookID);
    var borrowedDT = $("#borrowedDT-" + bookID);
    var returnDate = $("#returnDate-" + bookID);
    // var sid = $("#sid-" +  bookID);
    var adminID = $("#adminID-" +  bookID);

    // Validate the fields
    if (!bookIDD.val() || !borrowedDT.val() || !returnDate.val() || !adminID.val()) {
      $("#borrow-msg-" + bookID).html(`
      <div class="alert alert-danger alert-dismissible show" role="alert" id="alert">
        <strong>All fields are required!</strong>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>
      `);
      return; //  <div class="alert alert-danger">All fields are required!</div>
    }

    var formData = {
      bookIDD: bookIDD.val(),
      borrowedDT: borrowedDT.val(),
      returnDate: returnDate.val(),
      // sid: sid.val(),
      adminID: adminID.val(),
      action: "toBorrowAction"
    };


    // console.log("Sending data:", formData);

    $.ajax({
      url: "insert.php", 
      type: "POST",
      data: formData,
      success: function(response) {
        const res = JSON.parse(response); 
        console.log("Server response:", res); 

        if (res.isSuccess) {
          $("#borrow-msg-" + bookID).html(`
          <div class="alert alert-success alert-dismissible show" role="alert" id="alert">
              <strong>${res.msg}</strong>
              <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
          `);
          //window.reloadBooks();
          $("#form-borrow-" + bookID)[0].reset(); //<div class="alert alert-success">${res.msg}</div>
        } else {
          $("#borrow-msg-" + bookID).html(`
          <div class="alert alert-danger alert-dismissible show" role="alert"  id="alert">
              <div>${res.msg}</div>
              <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
          `);
          $("#form-borrow-" + bookID)[0].reset();
        }
      },
      error: function(xhr, status, error) {
        console.error("AJAX Error:", status, error);
        $("#borrow-msg-" + bookID).html(`
        <div class="alert alert-danger alert-dismissible show" role="alert" id="alert">
              <strong>An error occurred:</strong> ${error}
              <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        
        `);
      }
    });

    //mawawala sya after mo sya makita huhuhu ;(
    setTimeout(() => {
  const alert = document.getElementById(`alert`);
  if (alert) {
    alert.classList.add('hidden'); 
    alert.addEventListener('transitionend', () => {
      alert.remove();
    });
  }
}, 3000); 

  });
  
});
</script>
