<section class="record-page record-page--logs" data-record-view="logs">
    <header class="record-page-header">
        <p class="record-page-eyebrow">Activity</p>
        <h1>Transaction logs</h1>
        <p>Search borrowing and return activity across the library.</p>
    </header>

    <section class="record-panel" aria-labelledby="history-list-heading">
        <div class="record-panel-heading">
            <h2 id="history-list-heading">All transactions</h2>
            <p>Narrow the log by date, book, student, or transaction type.</p>
        </div>
        <div class="record-filter-bar" aria-label="Filter transaction logs">
            <div class="record-filter">
                <label for="history-filter-book">Book ID</label>
                <input class="form-control" id="history-filter-book" type="search" data-record-filter="1" placeholder="Find a book">
            </div>
            <div class="record-filter">
                <label for="history-filter-student">Student ID</label>
                <input class="form-control" id="history-filter-student" type="search" data-record-filter="2" placeholder="Find a student">
            </div>
            <div class="record-filter">
                <label for="history-filter-date">Transaction date</label>
                <input class="form-control" id="history-filter-date" type="date" data-record-filter="0">
            </div>
            <div class="record-filter">
                <label for="history-filter-type">Transaction type</label>
                <select id="history-filter-type" data-transaction-filter="3">
                    <option value="">All transaction types</option>
                </select>
            </div>
            <button class="record-filter-clear" type="button" data-clear-record-filters>Clear filters</button>
        </div>
        <div class="record-table-wrap">
            <table id="encounter" class="table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Book ID</th>
                        <th>Student ID</th>
                        <th>Transaction type</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </section>
</section>

<script src="scripts/history.js"></script>
<script src="scripts/record-filters.js"></script>
