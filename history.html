<style>

:root{
        --main-color: #70ee9c;
    }
    .panel-body {
        background-color: #222;
        border-radius: 8px;
        padding: 50px;
    }
    .panel-body1 {
        margin-bottom: 5px;
        background-color: #222;
        border-radius: 8px;
        padding: 50px;
        width: 100%;
    }

    .col-left {
        margin-bottom: 5px;
        background-color: #222;
        border-radius: 8px;
        padding: 50px;
        width: 28%;  
        margin-left: 10px; 
    }

    .table {
        width: 100%;
        border-collapse: collapse;
        font-family: Arial, sans-serif;
        font-size: 14px;
        color: #ffffff;
        background-color: #000000;
    }

    .table thead th {
        background-color: var(--main-color);
        color: #ffffff;
        font-weight: bold;
        text-align: left;
        padding: 10px;
        border: 1px solid var(--main-color);
    }

    .table tbody td {
        padding: 8px;
        border: 1px solid var(--main-color);
    }

    .table tbody tr:nth-child(even) {
        background-color: #70ee9c;
    }

    .table tbody tr:nth-child(odd) {
        background-color: #000000;
    }

    .table tbody tr:hover {
        background-color: var(--main-color);
        color: #ffffff;
    }

    .form-control {
        height: 40px;
        border: 1px solid #ccc;
        border-radius: 4px;
        padding: 5px 10px;
        font-size: 14px;
        color: #555;
        margin-bottom: 10px;
    }
   

    p {
        font-size: 16px;
        color: #555;
        font-weight: bold;
        margin-bottom: 10px;
    }

    .btn-btn {
        background-color: var(--main-color);
        color: #fff;
        border: none;
        border-radius: 4px;
        height: 40px;
        width: 100%;
        max-width: 300px;
        font-size: 14px;
        text-align: center;
        margin: 23px auto 0;
        cursor: pointer;
        transition: background-color 0.3s;
    }

    .btn-btn:hover {
        background-color: var(--main-color);
    }

    label {
        color: #fff;
    }

    /* .info-box {
        display: flex;

        font-size: 24px;
        margin-bottom: 10px;
        color: #70ee9c;
    } */

    .table-color{
    color: var(--main-color);
  }

</style>
