
<section class="borrowed-books-page" aria-labelledby="borrowed-books-title">
    <header class="library-page-heading">
        <div>
            <p class="library-eyebrow">Your library</p>
            <h1 id="borrowed-books-title">Borrowed books</h1>
            <p>Review your current loans, due dates, and past-due books.</p>
        </div>
    </header>
    <section class="borrowed-books-panel library-panel" aria-label="Your borrowed books">
        <ul class="nav nav-tabs borrowed-book-tabs" role="group" aria-label="Filter borrowed books">
            <li class="nav-item">
                <button class="nav-link active" type="button" aria-pressed="true" id="borrow-all">All</button>
            </li>
            <li class="nav-item">
                <button class="nav-link" type="button" aria-pressed="false" id="borrow-is">I.S.</button>
            </li>
            <li class="nav-item">
                <button class="nav-link" type="button" aria-pressed="false" id="borrow-psy">Psychology</button>
            </li>
            <li class="nav-item">
                <button class="nav-link" type="button" aria-pressed="false" id="borrow-ce">C.E.</button>
            </li>
            <li class="nav-item">
                <button class="nav-link" type="button" aria-pressed="false" id="borrow-ns">N.S.</button>
            </li>
            <li class="nav-item">
                <button class="nav-link" type="button" aria-pressed="false" id="borrow-mw">M.W.</button>
            </li>
            <li class="nav-item">
                <button class="nav-link nav-link-due" type="button" aria-pressed="false" id="borrow-over">Overdue</button>
            </li>
        </ul>
        <div class="borrow-types" id="borrow-types" role="region" aria-label="Borrowed book records" tabindex="0">
            <div id="borrow-box-all" class="borrow-record-list" aria-live="polite" aria-busy="true">
                <p class="borrow-results-state">Loading your borrowed books...</p>
            </div>
            <div id="borrow-box-all-over" class="borrow-record-list" aria-live="polite" aria-busy="true">
                <p class="borrow-results-state">Checking for overdue books...</p>
            </div>
        </div>
    </section>
</section>

<dialog class="book-cover-dialog" id="book-cover-dialog" aria-label="Book cover preview">
    <form method="dialog">
        <button class="book-cover-close" type="submit">Close</button>
    </form>
    <img src="" alt="">
    <p></p>
</dialog>

<script src="scripts/borrowAll.js"></script>
<script src="scripts/borrowUserNavs.js"></script>

<script>
    document.querySelectorAll('.borrowed-books-page .nav-link').forEach(function (tab) {
        tab.addEventListener('click', function () {
            document.querySelectorAll('.borrowed-books-page .nav-link').forEach(function (item) {
                item.classList.remove('active');
                item.setAttribute('aria-pressed', 'false');
            });
            this.classList.add('active');
            this.setAttribute('aria-pressed', 'true');
        });
    });
</script>


<script>
    function getCurrentDate() {
      const now = new Date();
      const philippineOffset = 8 * 60; 
      const philippineTime = new Date(now.getTime() + (now.getTimezoneOffset() + philippineOffset) * 60 * 1000);
      return philippineTime.toISOString().split("T")[0];
    }
    function getAdd30daysDate() {
      const now = new Date();
      const philippineOffset = 8 * 60;
      const philippineTime = new Date(now.getTime() + (now.getTimezoneOffset() + philippineOffset) * 60 * 1000);
      philippineTime.setDate(philippineTime.getDate() + 30);
      return philippineTime.toISOString().split("T")[0];
    }
  </script>
